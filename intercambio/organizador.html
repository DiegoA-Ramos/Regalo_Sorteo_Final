<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegaloSort – Organizador</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="page-wrapper">

  <div class="text-center mb-3">
    <a href="index.html" class="text-decoration-none">
      <h1 class="logo-title">Regalo Sorteo</h1>
    </a>
  </div>

  <!-- step bar -->
  <div class="step-bar mb-3">
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
  </div>

  <div class="card-box">
    <h2 class="mb-1 fw-black">¿Quien va a organizar?</h2>
    <p class="text-muted mb-4" style="font-size:.9rem;">Escribe el nombre del organizador</p>

    <label class="fw-bold mb-1 d-block" for="inp-organizador">Nombre:</label>
    <input id="inp-organizador" class="inp mb-3"/>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="chk-incluir" />
      <label class="form-check-label fw-semibold" for="chk-incluir">
        Incluirlo en el sorteo
      </label>
    </div>

    <div id="alerta" class="mb-3"></div>

    <div class="d-flex justify-content-between align-items-center">
      <a href="index.html" class="btn-ghost">Inicio</a>
      <button class="btn-main" onclick="guardar()">Continuar</button>
    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script>
  // Pre-cargar si ya existe
  window.addEventListener('DOMContentLoaded', () => {
    const ev = obtenerEvento();
    if (ev && ev.organizador) {
      document.getElementById('inp-organizador').value = ev.organizador;
      document.getElementById('chk-incluir').checked = ev.incluirOrganizador;
    }
  });

  function guardar() {
    const nombre = document.getElementById('inp-organizador').value.trim();
    if (!nombre) {
      document.getElementById('alerta').innerHTML =
        '<div class="alert alert-warning py-2">Escribe tu nombre para continuar.</div>';
      return;
    }

    const incluir = document.getElementById('chk-incluir').checked;

    // Si existe un evento previo, conservar datos; si no, crear vacío
    let evento = obtenerEvento() || eventoVacio();

    // Si cambia el organizador, reiniciar participantes para evitar duplicados
    if (evento.organizador !== nombre) {
      evento = eventoVacio();
    }

    evento.organizador = nombre;
    evento.incluirOrganizador = incluir;

    // Asegurarse de que el organizador esté o no en participantes según el checkbox
    evento.participantes = evento.participantes.filter(p => p !== evento.organizador);
    if (incluir) evento.participantes.unshift(nombre);

    guardarEvento(evento);
    window.location.href = 'participantes.html';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

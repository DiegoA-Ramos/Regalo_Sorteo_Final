<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegaloSort – Sorteo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/styleSorteo.css">
  
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<div class="page-wrapper">

  <div class="text-center mb-3">
    <a href="index.html" class="text-decoration-none">
      <h1 class="logo-title">Regalo Sorteo</h1>
    </a>
  </div>

  <div class="step-bar mb-4">
    <div class="step-dot done"></div>
    <div class="step-dot done"></div>
    <div class="step-dot done"></div>
    <div class="step-dot done"></div>
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
  </div>

  <!-- Tabs solo visibles en móvil (< md) -->
  <ul class="nav nav-pills justify-content-center mb-4 gap-2 flex-wrap" id="tabs-nav">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-datos" type="button">
        Datos del evento
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-sorteo" type="button">
        Sorteo
      </button>
    </li>
  </ul>

  <!-- ── Bootstrap grid: 1 col en móvil, 2 cols en md+ ── -->
  <div class="container-fluid px-3" style="max-width:960px; width:100%;">
    <div class="row g-4 tab-content">

      <!-- ══ COLUMNA DATOS ══ -->
      <div class="col-12 col-md-5 tab-pane fade show active" id="tab-datos">
        <div class="card-box h-100">
          <h2 class="fw-black mb-1">Datos del evento</h2>
          <div id="datos-contenido"></div>

          <hr class="fancy" />
          <div class="d-flex flex-wrap gap-2">
            <a href="evento.html"        class="btn-ghost" style="font-size:.82rem;">Editar evento</a>
            <a href="participantes.html" class="btn-ghost" style="font-size:.82rem;">Participantes</a>
            <button class="btn-outline"  style="font-size:.82rem;" onclick="nuevoEvento()">Nuevo</button>
          </div>
        </div>
      </div>

      <!-- ══ COLUMNA SORTEO ══ -->
      <div class="col-12 col-md-7 tab-pane fade" id="tab-sorteo">
        <div class="card-box h-100 text-center">

          <!-- Estado inicial -->
          <div id="estado-inicio">
            <p class="sorteo-header">Inicio del sorteo</p>
            <p class="text-muted mb-4" style="font-size:.9rem;">
              El algoritmo asignara a cada persona su receptor<br>respetando todas las exclusiones
            </p>
            <button class="btn-main px-5 py-3" style="font-size:1.1rem;" onclick="lanzar()">
              Realizar sorteo
            </button>
          </div>

          <!-- Animación bombo -->
          <div class="drum-wrap" id="drum-anim">
            <p class="drum-text">SORTEANDO...</p>
            <div class="spinner-border text-danger mt-2" style="width:2.2rem;height:2.2rem;"></div>
          </div>

          <!-- Resultados -->
          <div id="estado-resultado" class="d-none text-start">
            <h3 class="fw-black text-center mb-4" style="color:var(--primary);">Resultados</h3>
            <div id="lista-resultados" class="d-flex flex-column gap-3"></div>
            <div class="text-center mt-4 d-flex flex-wrap justify-content-center gap-2">
              <button class="btn-outline" onclick="resetSorteo()">Sortear de nuevo</button>
              <button class="btn-ghost"   onclick="nuevoEvento()">Nuevo evento</button>
            </div>
          </div>

          <!-- Error -->
          <div id="error-sorteo" class="d-none">
            <div class="alert alert-danger mt-3 text-start">
              No se pudo generar un sorteo válido con las exclusiones actuales.
              <a href="exclusiones.html" class="fw-bold">Revisa las exclusiones →</a>
            </div>
          </div>

        </div>
      </div>

    </div><!-- /row -->
  </div><!-- /container -->

  <div class="text-center mt-3">
    <a href="index.html" class="btn-main">Inicio</a>
  </div>

</div><!-- /page-wrapper -->

<script src="js/storage.js"></script>
<script src="js/sorteo.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const ev = obtenerEvento();
  if (!ev || !ev.organizador) { window.location.href = 'organizador.html'; return; }
  renderDatos();
  if (ev.resultadoSorteo && ev.resultadoSorteo.length) mostrarResultados(ev.resultadoSorteo);
});

// ── DATOS (lee SIEMPRE desde localStorage, nunca de RAM) ─
function renderDatos() {
  const evento = JSON.parse(localStorage.getItem('regalo_evento'));
  const cont   = document.getElementById('datos-contenido');
  if (!evento) { cont.innerHTML = '<p class="text-muted">Sin datos.</p>'; return; }

  const fmt = evento.fecha
    ? new Date(evento.fecha + 'T12:00:00').toLocaleDateString('es-MX',
        { weekday:'long', year:'numeric', month:'long', day:'numeric' })
    : '—';

  const excl = evento.exclusiones && evento.exclusiones.length
    ? evento.exclusiones.map(e =>
        `<div><span class="tag-pill">${e.persona}</span>
         <small style="color:var(--muted)"> ≠ </small>
         ${e.noPuedeDarA.map(x => `<span class="tag-pill">${x}</span>`).join('')}</div>`
      ).join('')
    : '<span class="text-muted" style="font-size:.82rem;">Ninguna</span>';

  cont.innerHTML = `
    <div class="info-row">
      <span class="info-label"> Organizador:</span>
      <span>${evento.organizador}
        ${evento.incluirOrganizador ? '<span class="tag-pill">participa</span>' : ''}
      </span>
    </div>
    <div class="info-row">
      <span class="info-label">Celebracion:</span>
      <span>${evento.celebracion || '—'}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Fecha:</span>
      <span>${fmt}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Presupuesto:</span>
      <span class="fw-bold">$${evento.presupuesto} MXN</span>
    </div>
    <div class="info-row">
      <span class="info-label">Participantes:</span>
      <span>${evento.participantes.map(p => `<span class="tag-pill">${p}</span>`).join('')}</span>
    </div>
    <div class="info-row" style="border:none;">
      <span class="info-label">Exclusiones:</span>
      <span>${excl}</span>
    </div>
  `;
}

// ── SORTEO ────────────────────────────────────────────────
function lanzar() {
  document.getElementById('estado-inicio').classList.add('d-none');
  document.getElementById('drum-anim').classList.add('show');

  setTimeout(() => {
    document.getElementById('drum-anim').classList.remove('show');
    const resultado = realizarSorteo();
    if (!resultado) {
      document.getElementById('error-sorteo').classList.remove('d-none');
      document.getElementById('estado-inicio').classList.remove('d-none');
      return;
    }
    mostrarResultados(resultado);
  }, 2000);
}

function mostrarResultados(resultado) {
  document.getElementById('estado-inicio').classList.add('d-none');
  document.getElementById('drum-anim').classList.remove('show');
  document.getElementById('estado-resultado').classList.remove('d-none');

  const lista = document.getElementById('lista-resultados');
  lista.innerHTML = '';
  resultado.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'resultado-card';
    card.style.animationDelay = `${i * 0.12}s`;
    card.innerHTML = `
      <span class="giver">${r.de}</span>
      <span class="arrow">➜</span>
      <span class="getter">${r.para}</span>
    `;
    lista.appendChild(card);
  });
}

function resetSorteo() {
  document.getElementById('estado-resultado').classList.add('d-none');
  document.getElementById('error-sorteo').classList.add('d-none');
  document.getElementById('estado-inicio').classList.remove('d-none');
  document.getElementById('lista-resultados').innerHTML = '';
}

function nuevoEvento() {
  if (confirm('¿Empezar un nuevo evento? Se borrará el actual.')) {
    limpiarStorage();
    window.location.href = 'index.html';
  }
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

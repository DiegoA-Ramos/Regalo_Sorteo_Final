<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegaloSort – Participantes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="page-wrapper">

  <div class="text-center mb-3">
    <a href="index.html" class="text-decoration-none">
      <h1 class="logo-title">Regalo Sorteo</h1>
    </a>
  </div>

  <div class="step-bar mb-3">
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
  </div>

  <div class="container-fluid px-3" style="max-width:720px; width:100%;">
    <div class="row g-4">

      <div class="col-12 col-md-5">
        <div class="card-box h-100">
          <h2 class="mb-1 fw-black">Agregar</h2>
          <p class="text-muted mb-3" style="font-size:.88rem;">
            Escribe el nombre de cada participante y presiona Aceptar
          </p>

          <label class="fw-bold mb-1 d-block" for="inp-nombre">Nombre</label>
          <input id="inp-nombre" class="inp mb-3"/>

          <button class="btn-main w-100" onclick="agregar()">Aceptar</button>

          <div id="alerta" class="mt-3"></div>

          <hr class="fancy" />

          <div class="d-flex justify-content-between">
            <a href="organizador.html" class="btn-ghost"> Atras</a>
            <button class="btn-main" onclick="continuar()">Continuar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-7">
        <div class="card-box h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-black mb-0">Lista</h2>
            <span id="contador" class="badge bg-danger rounded-pill" style="font-size:.8rem;"></span>
          </div>

          <p class="text-muted mb-3" style="font-size:.85rem;">
            Participantes de el intercambio:
          </p>

          <div id="lista-participantes"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const ev = obtenerEvento();
  if (!ev || !ev.organizador) { window.location.href = 'organizador.html'; return; }
  renderLista();
});

function renderLista() {
  const evento = obtenerEvento();
  const cont   = document.getElementById('lista-participantes');
  const count  = document.getElementById('contador');
  cont.innerHTML = '';

  const total = evento.participantes.length;
  count.textContent = total > 0 ? `${total} persona${total !== 1 ? 's' : ''}` : '';

  if (!total) {
    cont.innerHTML = '<p class="text-muted text-center py-4" style="font-size:.9rem;">Aún no hay participantes</p>';
    return;
  }

  evento.participantes.forEach(nombre => {
    const esOrg = nombre === evento.organizador && evento.incluirOrganizador;
    const item  = document.createElement('div');
    item.className = 'drag-item mb-2';  
    item.style.cursor = 'default';
    item.innerHTML = `
      <span style="font-size:1.1rem;"></span>
      <span class="drag-name">
        ${nombre}
        ${esOrg ? '<small style="color:var(--muted);font-weight:600;"></small>' : ''}
      </span>
      ${!esOrg
        ? `<button class="btn-icon" title="Eliminar" onclick="eliminar('${nombre.replace(/'/g,"\\'")}')">✕</button>`
        : '<span style="width:28px;"></span>'}
    `;
    cont.appendChild(item);
  });
}

function agregar() {
  const inp    = document.getElementById('inp-nombre');
  const nombre = inp.value.trim();
  const alerta = document.getElementById('alerta');
  alerta.innerHTML = '';

  if (!nombre) return;

  const evento = obtenerEvento();
  if (evento.participantes.map(p => p.toLowerCase()).includes(nombre.toLowerCase())) {
    alerta.innerHTML = `<div class="alert alert-warning py-2">"${nombre}" ya está en la lista.</div>`;
    inp.value = '';
    return;
  }

  evento.participantes.push(nombre);
  guardarEvento(evento);
  inp.value = '';
  inp.focus();
  renderLista();
}

function eliminar(nombre) {
  const evento = obtenerEvento();
  evento.participantes = evento.participantes.filter(p => p !== nombre);
  evento.exclusiones = evento.exclusiones
    .filter(e => e.persona !== nombre)
    .map(e => ({ ...e, noPuedeDarA: e.noPuedeDarA.filter(x => x !== nombre) }));
  guardarEvento(evento);
  renderLista();
}

function continuar() {
  const evento = obtenerEvento();
  if (!evento || evento.participantes.length < 2) {
    document.getElementById('alerta').innerHTML =
      '<div class="alert alert-warning py-2">Agrega al menos 2 participantes para continuar.</div>';
    return;
  }
  window.location.href = 'exclusiones.html';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

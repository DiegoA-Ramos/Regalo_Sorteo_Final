<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regalo Sorteo – Intercambio de Regalos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/styleIndex.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<div class="splash-wrap">
  <span class="splash-gift"></span>
  <h1 class="splash-title mt-2">Regalo Sorteo</h1>
  
  <p class="logo-sub mb-2">Intercambio de regalos</p>
  <p class="splash-desc">Organiza tu sorteo entre amigos rapido y facil </p>
  <p class="splash-desc">Por Diego Ramos Vazquez y Cesar Ortiz Riestra </p>

  <div class="features">
    <span class="feature-badge"> Drag & Drop</span>
    <span class="feature-badge"> LocalStorage</span>
    <span class="feature-badge"> Responsive</span>
    <span class="feature-badge"> Sin backend</span>
  </div>

  <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
    <a href="organizador.html" class="btn-main px-5 py-3 text-decoration-none" style="font-size:1.1rem;">
       Crear nuevo evento
    </a>
    <button class="btn-outline px-4 py-3" onclick="continuarEvento()">
       Continuar evento guardado
    </button>
  </div>
</div>

<script src="js/storage.js"></script>
<script>
function continuarEvento() {
  const evento = obtenerEvento();
  if (!evento || !evento.organizador) {
    alert('No hay ningún evento guardado. Crea uno nuevo.');
    return;
  }
  window.location.href = 'sorteo.html';
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
